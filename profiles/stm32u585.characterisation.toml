# the six cells of the decomposition that had the aggressor in the stack's region with the arena elsewhere. they read 0.109 and 0.126 for SRAM1, 0.108 and 0.126 for SRAM2, and 0.114 and 0.113 for SRAM3, and the note reports their mean as 0.116.
# why the mean is not keyed by a region from this campaign: the descriptor page sat in SRAM3 in every capture of it, so each region's pair contains one cell whose victim has an object in SRAM3 and one whose victim does not, and the first of each pair carries the descriptor term this file holds as a separate coefficient. no capture in that campaign separates the two.
[[coefficient]]
object = "stack"
requester = "gpdma1"
endpoint = "data"
basis = "mean"
minimum = 0.108
maximum = 0.126
cells = 6
campaign = "arena-or-stack-2026-09-16"

# the six cells of the decomposition that had the aggressor in the arena's region with the stack elsewhere. they read 0.139 and 0.163 for SRAM1, 0.138 and 0.163 for SRAM2, and 0.152 and 0.152 for SRAM3, and the note reports their mean as 0.151.
# why the mean is not keyed by a region from this campaign: the descriptor page sat in SRAM3 in every capture of it, so each region's pair contains one cell whose victim has an object in SRAM3 and one whose victim does not, and the first of each pair carries the descriptor term this file holds as a separate coefficient. no capture in that campaign separates the two.
[[coefficient]]
object = "arena"
requester = "gpdma1"
endpoint = "data"
basis = "mean"
minimum = 0.138
maximum = 0.163
cells = 6
campaign = "arena-or-stack-2026-09-16"

# the cell of the eight cell descriptor table with the descriptor page in SRAM3 and the stack in SRAM3, which is this overlap's configuration.
# the conditions of that table: the arena in SRAM1 and the aggressor's data in SRAM2 in all eight cells, so the cost is the page being fetched into a region the victim uses rather than the aggressor's data traffic.
# the same table reads 0.026 for the stack in SRAM1 against the page in SRAM1, so this number belongs to SRAM3 and the schema cannot yet say so.
[[coefficient]]
object = "stack"
requester = "gpdma1"
endpoint = "descriptors"
basis = "measured"
value = 0.020
campaign = "closing-2026-09-19"

# an upper bound and not a point estimate. the note bounds the 88 bytes at 0.001 and says they were never isolated, because moving them needs a section attribute or a linker change rather than a run time knob.
[[coefficient]]
object = "runtime.state"
requester = "gpdma1"
endpoint = "data"
basis = "bounded"
minimum = 0.0
maximum = 0.001
campaign = "closing-2026-09-19"

# no capture has the radio associated, so there is nothing to attribute and no campaign.
[[coefficient]]
object = "stack"
requester = "emw3080"
endpoint = "spi dma"
basis = "unmeasured"

# the contention free charge, which is what a victim pays for occupying a region at all with every requester off, charged once per occupied region however many of the victim's parts are in it.
# measured in experiment 2 of the campaign's note: the inference victim, no channel started at any point of any capture, the arena in three regions crossed with the stack in three regions for nine cells, every cell truncated to the first 2516 records, and a region sum that fits the nine cells to within one cycle against 30 for the additive shape and 3 for the maximum.
# no accesses field: the inference victim's access count was never counted, which the captures record as "not counted for inference", so these charges stay with the victim they were measured on rather than being scaled to another one.
# the read loop victim's charges exist and are not written here, because they are not reviewed yet.
[[quiet]]
region = "sram1"
victim = "inference"
basis = "measured"
value = 0
campaign = "closing-2026-09-19"

